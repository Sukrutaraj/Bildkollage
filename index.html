<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bildkollage</title>
<style>
:root{--ink:#111;--muted:#666;--line:#e3e3e3;--bg:#f5f5f5;--accent:#1976d2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}
header{padding:32px 16px 16px;text-align:center}
h1{font-size:clamp(1.7rem,4vw,2.2rem);margin:0}
h2{font-size:1.3rem;margin:0 0 6px;text-align:center}
p{margin:.25rem 0;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 40px}
.panel{background:#fff;border-radius:18px;padding:24px;margin-bottom:16px}
button,.button{border:0;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,.button:focus-visible{outline:3px solid #91c9b6;outline-offset:2px}
.primary{background:var(--accent);color:#fff}.secondary{background:#eee;color:#111}
button:disabled{opacity:.45;cursor:not-allowed}
#fileInput{display:none}
.stepper{display:flex;justify-content:center;gap:8px;margin:0 auto 18px;flex-wrap:wrap}
.step-dot{padding:8px 14px;border-radius:8px;background:#e6e6e6;color:#666;font-size:.95rem}
.step-dot.active{background:var(--accent);color:#fff}
.step-dot.done{background:#e5f1fb;color:#145b9e}
.upload-start{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.upload-symbol{font-size:62px;line-height:1}
.big{font-size:1.2rem;padding:16px 30px;min-width:230px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}
.pill{border-radius:6px;background:#f0f0f0;padding:5px 10px;font-size:.9rem;color:var(--muted)}
.status{text-align:center;font-size:1rem;color:#333;min-height:1.5em}
.progress{height:10px;background:#eee;border-radius:5px;overflow:hidden;max-width:360px;margin:6px auto 0}
.progress div{height:100%;width:0;background:var(--accent)}
.image-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa;position:relative}
.thumb .pic{display:block;width:100%;height:115px;object-fit:contain;background:#f2f2f2}
.thumb .wait{height:115px;display:flex;align-items:center;justify-content:center;background:#f2f2f2;color:#888;font-size:.9rem}
.thumb .order{position:absolute;top:6px;left:6px;background:#000a;color:#fff;border-radius:6px;padding:2px 8px;font-size:.85rem}
.thumb-foot{display:flex;justify-content:space-between;gap:4px;padding:6px;min-height:42px}
.thumb-foot button{padding:5px 9px;border-radius:7px;background:#ececec;font-size:.85rem}
.thumb-foot .back-poster{width:100%;margin-top:5px;background:#e5f1fb;color:#145b9e;font-size:.82rem}
.thumb-foot .back-poster[aria-pressed="true"]{background:var(--accent);color:#fff}
.thumb-foot{flex-wrap:wrap}
.thumb-foot .move-row{display:flex;justify-content:space-between;gap:4px;width:100%}
.thumb-foot .del{background:#fde8e8;color:#9b1c1c}
.nav{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
/* Layoutförslag */
.proposals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.proposal{border:3px solid #e4e4e4;border-radius:16px;padding:14px;background:#fff;cursor:pointer;text-align:left;display:block;width:100%;color:inherit}
.proposal[aria-pressed="true"]{border-color:var(--accent);background:#f3f8fd}
.proposal-title{font-weight:700;margin-bottom:2px}
.proposal-sub{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.mini-pages{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proposal-check{margin-top:10px;font-size:.95rem;color:var(--muted)}
.proposal[aria-pressed="true"] .proposal-check{color:var(--accent);font-weight:700}
/* Sidor */
.preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:16px}
.page-wrap{min-width:0}
.page-label{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.page{position:relative;width:100%;aspect-ratio:210/297;background:#fff;border:1px solid #cfd6d2;overflow:hidden}
.preview .page{box-shadow:0 5px 18px rgba(0,0,0,.08)}
.cell{position:absolute;overflow:hidden}
.cell img{display:block;width:100%;height:100%;object-fit:cover}
.cell img.rot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
.cell img.fit-contain{object-fit:contain;background:#fff}
/* Nedladdning */
.formats{display:flex;justify-content:center;gap:0;margin:22px auto 0;width:max-content;max-width:100%;background:#eee;border-radius:10px;padding:4px}
.format{background:transparent;color:#333;border-radius:8px;padding:10px 22px}
.format[aria-pressed="true"]{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.format-help{text-align:center;margin-top:8px}
.msg{text-align:center;min-height:1.5em;margin-top:10px;color:#333}
.notice{padding:12px 14px;background:#f7f7f7;border-radius:10px;color:#555;font-size:.9rem;margin-top:16px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 16px 24px}
[hidden]{display:none!important}
#printRoot{display:none}
@media(max-width:800px){.proposals{grid-template-columns:1fr}}
@media(max-width:700px){.preview{grid-template-columns:1fr}.panel{padding:16px 12px}}
@media print{
 @page{size:A4 portrait;margin:0}
 body{background:#fff}
 header,main,footer{display:none!important}
 #printRoot{display:block!important}
 .print-page{position:relative;width:210mm;height:297mm;overflow:hidden;break-after:page;page-break-after:always}
 .print-page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<header><h1>Bildkollage</h1></header>
<main>
 <nav class="stepper" aria-label="Steg">
  <div class="step-dot active" data-step-dot="0">1 Bilder</div>
  <div class="step-dot" data-step-dot="1">2 Välj layout</div>
  <div class="step-dot" data-step-dot="2">3 Ladda ner</div>
 </nav>

 <!-- STEG 1: Bilder -->
 <section class="panel" data-step="0">
  <div class="upload-start" id="uploadStart">
   <div class="upload-symbol" aria-hidden="true">📷</div>
   <label class="button primary big" for="fileInput">＋ Lägg till bilder</label>
   <p>1–20 bilder. Välj eventuellt en bild som egen A4-baksida.</p>
  </div>
  <input id="fileInput" type="file" accept="image/*" multiple>
  <div id="selectedToolbar" class="toolbar" hidden>
   <span id="countPill" class="pill">0 bilder</span>
   <label class="button secondary" for="fileInput" id="addMore">＋ Lägg till fler</label>
   <button id="clearBtn" class="secondary" type="button">Rensa alla</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="progress" class="progress" hidden><div id="progressBar"></div></div>
  <div id="imageList" class="image-list"></div>
  <div class="nav"><button id="next1" class="primary big" type="button" disabled>Nästa →</button></div>
 </section>

 <!-- STEG 2: Välj layout -->
 <section class="panel" data-step="1" hidden>
  <h2>Välj en layout</h2>
  <p style="text-align:center">Tryck på det bildark du tycker bäst om.</p>
  <div id="proposals" class="proposals"></div>
  <div class="nav">
   <button id="back2" class="secondary" type="button">← Tillbaka</button>
   <button id="next2" class="primary big" type="button">Nästa →</button>
  </div>
 </section>

 <!-- STEG 3: Ladda ner -->
 <section class="panel" data-step="2" hidden>
  <h2>Ladda ner</h2>
  <div id="preview" class="preview"></div>
  <div class="formats" role="group" aria-label="Filformat">
   <button type="button" class="format" data-format="pdf" aria-pressed="true">PDF</button>
   <button type="button" class="format" data-format="jpg" aria-pressed="false">JPG</button>
   <button type="button" class="format" data-format="png" aria-pressed="false">PNG</button>
  </div>
  <p id="formatHelp" class="format-help"></p>
  <div class="nav" id="dlButtons"></div>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div class="notice">Skriv ut <strong>dubbelsidigt</strong> (vänd längs långa kanten).</div>
  <div class="nav">
   <button id="back3" class="secondary" type="button">← Tillbaka</button>
   <button id="printBtn" class="secondary" type="button">🖨 Skriv ut direkt</button>
   <button id="restart" class="secondary" type="button">Börja om med nya bilder</button>
  </div>
 </section>
</main>
<footer>Bildkollage</footer>
<div id="printRoot" aria-hidden="true"></div>

<script>
(() => {
 // ================= Inställningar =================
 const PAGE = { W: 210, H: 297, MARGIN: 5, GAP: 2 }; // mm. 5 mm marginal så skrivaren inte klipper
 const MAX_IMAGES = 20;
 const MAX_CROP = 0.22;       // ungefär högst 22 % beskärning per bild i "fyll"-lägen
 const WORK_PX = 2400;        // bilder förminskas till max 2400 px (räcker för skarp A4-utskrift)
 const THUMB_PX = 360;        // små bilder för listan och förslagen
 const EXPORT_DPI = 220;      // upplösning i PDF/JPG/PNG
 const PARALLEL = 3;          // antal bilder som behandlas samtidigt

 const $ = id => document.getElementById(id);
 const imageList = $('imageList'), status = $('status');
 let images = [];             // {id, name, ready, url, thumb, src(canvas), w, h}
 let nextId = 1, loading = 0, loaded = 0, toLoad = 0;
 let proposals = [], selected = 0, format = 'pdf', posterBackId = null;

 // ================= Steg =================
 function showStep(step) {
   document.querySelectorAll('[data-step]').forEach(p => p.hidden = Number(p.dataset.step) !== step);
   document.querySelectorAll('[data-step-dot]').forEach(d => {
     const n = Number(d.dataset.stepDot);
     d.classList.toggle('active', n === step);
     d.classList.toggle('done', n < step);
   });
   if (step === 1) renderProposals();
   if (step === 2) renderPreview();
   window.scrollTo({ top: 0 });
 }
 $('next1').addEventListener('click', () => { if (canContinue()) { buildProposals(); showStep(1); } });
 $('back2').addEventListener('click', () => showStep(0));
 $('next2').addEventListener('click', () => showStep(2));
 $('back3').addEventListener('click', () => showStep(1));
 $('restart').addEventListener('click', () => { clearAll(); showStep(0); });
 $('clearBtn').addEventListener('click', () => { clearAll(); status.textContent = 'Alla bilder är borttagna.'; });

 function canContinue() { return images.length > 0 && loading === 0; }
 function clearAll() {
   images.forEach(x => { if (x.url) URL.revokeObjectURL(x.url); if (x.thumb) URL.revokeObjectURL(x.thumb); });
   images = []; proposals = []; selected = 0; posterBackId = null;
   renderList();
 }

 // ================= Snabb inläsning =================
 // Bilden avkodas utanför huvudtråden (createImageBitmap), förminskas direkt och
 // flera bilder behandlas samtidigt. Varje bild får en fast ruta direkt, så
 // ingenting hoppar runt när bilderna blir klara.
 const canvasBlob = (cv, q) => new Promise(r => cv.toBlob(r, 'image/jpeg', q));
 function scaled(src, sw, sh, max) {
   const s = Math.min(1, max / Math.max(sw, sh));
   const cv = document.createElement('canvas');
   cv.width = Math.max(1, Math.round(sw * s)); cv.height = Math.max(1, Math.round(sh * s));
   const ctx = cv.getContext('2d');
   ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); // vit bakgrund för genomskinliga PNG
   ctx.imageSmoothingQuality = 'high';
   ctx.drawImage(src, 0, 0, cv.width, cv.height);
   return cv;
 }
 async function decode(file) {
   if (window.createImageBitmap) {
     try { const b = await createImageBitmap(file, { imageOrientation: 'from-image' }); return { src: b, w: b.width, h: b.height, close: () => b.close && b.close() }; }
     catch (e) { /* t.ex. HEIC i Safari – prova vanlig bild nedan */ }
   }
   const url = URL.createObjectURL(file), el = new Image();
   el.src = url; await el.decode();
   return { src: el, w: el.naturalWidth, h: el.naturalHeight, close: () => URL.revokeObjectURL(url) };
 }
 async function processImage(item, file) {
   try {
     const d = await decode(file);
     const work = scaled(d.src, d.w, d.h, WORK_PX);
     d.close();
     const thumbCv = scaled(work, work.width, work.height, THUMB_PX);
     const [big, small] = await Promise.all([canvasBlob(work, 0.9), canvasBlob(thumbCv, 0.8)]);
     Object.assign(item, { ready: true, src: work, w: work.width, h: work.height, url: URL.createObjectURL(big), thumb: URL.createObjectURL(small) });
   } catch (e) {
     item.failed = true;
   }
 }

 $('fileInput').addEventListener('change', async e => {
   const files = [...e.target.files];
   e.target.value = '';
   const room = MAX_IMAGES - images.length;
   if (room <= 0) { status.textContent = `Max ${MAX_IMAGES} bilder. Ta bort någon först.`; return; }
   const accepted = files.slice(0, room);
   const items = accepted.map(f => ({ id: nextId++, name: f.name, ready: false }));
   images.push(...items);
   loading += items.length; toLoad += items.length;
   renderList();
   const queue = items.map((it, i) => [it, accepted[i]]);
   let failed = 0;
   const worker = async () => {
     while (queue.length) {
       const [it, f] = queue.shift();
       await processImage(it, f);
       loading--; loaded++;
       if (it.failed) { failed++; images = images.filter(x => x !== it); }
       updateCard(it);
       updateProgress();
     }
   };
   await Promise.all(Array.from({ length: PARALLEL }, worker));
   const msgs = [];
   if (files.length > room) msgs.push(`Max ${MAX_IMAGES} bilder – ${files.length - room} lades inte till.`);
   if (failed) msgs.push(`${failed} bild(er) kunde inte läsas. Ta en skärmdump av bilden och prova igen.`);
   if (loading === 0) { loaded = 0; toLoad = 0; }
   renderList();
   status.textContent = msgs.join(' ') || (images.length ? 'Klart! Tryck på Nästa.' : '');
 });

 function updateProgress() {
   const busy = loading > 0;
   $('progress').hidden = !busy;
   $('progressBar').style.width = (toLoad ? loaded / toLoad * 100 : 0) + '%';
   if (busy) status.textContent = `Bilderna laddas … ${loaded} av ${toLoad}`;
   $('next1').disabled = !canContinue();
   $('addMore').style.pointerEvents = busy ? 'none' : '';
   $('addMore').style.opacity = busy ? .45 : '';
   $('clearBtn').disabled = busy;
 }

 function move(id, dir) {
   const i = images.findIndex(x => x.id === id), j = i + dir;
   if (i < 0 || j < 0 || j >= images.length) return;
   [images[i], images[j]] = [images[j], images[i]];
   renderList();
 }
 function removeImage(id) {
   if (posterBackId === id) posterBackId = null;
   const i = images.findIndex(x => x.id === id);
   if (i >= 0) { const x = images[i]; if (x.url) URL.revokeObjectURL(x.url); if (x.thumb) URL.revokeObjectURL(x.thumb); images.splice(i, 1); }
   renderList();
 }

 function cardContent(card, im, i) {
   card.innerHTML = '';
   if (im.ready) {
     const img = document.createElement('img'); img.className = 'pic'; img.src = im.thumb; img.alt = im.name;
     card.append(img);
   } else {
     const w = document.createElement('div'); w.className = 'wait'; w.textContent = 'Laddar …';
     card.append(w);
   }
   const order = document.createElement('div'); order.className = 'order'; order.textContent = i + 1;
   const foot = document.createElement('div'); foot.className = 'thumb-foot';
   if (im.ready && loading === 0) {
     const mk = (txt, label, fn, cls, dis) => {
       const b = document.createElement('button'); b.type = 'button'; b.textContent = txt;
       b.setAttribute('aria-label', label); if (cls) b.className = cls; b.disabled = !!dis;
       b.addEventListener('click', fn); return b;
     };
     const moveRow = document.createElement('div'); moveRow.className = 'move-row';
     moveRow.append(
       mk('←', 'Flytta bakåt', () => move(im.id, -1), '', i === 0),
       mk('✕', 'Ta bort ' + im.name, () => removeImage(im.id), 'del'),
       mk('→', 'Flytta framåt', () => move(im.id, 1), '', i === images.length - 1)
     );
     const poster = mk(posterBackId === im.id ? 'Baksida A4 ✓' : 'Baksida A4', posterBackId === im.id ? 'Ta bort som baksida A4' : 'Använd som egen baksida i A4', () => { posterBackId = posterBackId === im.id ? null : im.id; renderList(); }, 'back-poster');
     poster.setAttribute('aria-pressed', String(posterBackId === im.id));
     foot.append(moveRow, poster);
   }
   card.append(order, foot);
 }
 function updateCard(im) {
   const card = imageList.querySelector(`[data-id="${im.id}"]`);
   if (!card) return;
   if (im.failed) { card.remove(); return; }
   cardContent(card, im, images.indexOf(im));
 }
 function renderList() {
   imageList.innerHTML = '';
   $('uploadStart').hidden = images.length > 0;
   $('selectedToolbar').hidden = images.length === 0;
   $('countPill').textContent = `${images.length} ${images.length === 1 ? 'bild' : 'bilder'}`;
   images.forEach((im, i) => {
     const card = document.createElement('div'); card.className = 'thumb'; card.dataset.id = im.id;
     cardContent(card, im, i);
     imageList.append(card);
   });
   updateProgress();
 }

 // ================= Layout =================
 // Kollage: bilderna läggs i rader (eller kolumner) som går kant till kant.
 // Verktyget provar alla uppdelningar och många ordningar och väljer de som
 // fyller sidan bäst med så jämnstora bilder som möjligt.
 const AW = PAGE.W - 2 * PAGE.MARGIN, AH = PAGE.H - 2 * PAGE.MARGIN;

 // Snabb poängsättning (utan att bygga några rutor).
 // a = bildernas proportioner i ordning, mask = var raderna bryts.
 const hsBuf = new Float64Array(32);
 function score(a, mask, fill, cols) {
   const G = PAGE.GAP, n = a.length;
   const aw = cols ? AH : AW, ah = cols ? AW : AH;
   let r = 0, sumA = 0, cnt = 0, sumH = 0;
   for (let i = 0; i < n; i++) {
     sumA += cols ? 1 / a[i] : a[i]; cnt++;
     if (i === n - 1 || (mask & (1 << i))) {
       const h = (aw - (cnt - 1) * G) / sumA;
       hsBuf[r++] = h; sumH += h; sumA = 0; cnt = 0;
     }
   }
   const availH = ah - (r - 1) * G;
   const fy = fill ? availH / sumH : 1;
   const s = fill ? 1 : Math.min(1, availH / sumH);
   let row = 0, cnt2 = 0, sum = 0, sumSq = 0;
   // räkna radlängder igen för att para ihop bild och rad
   for (let i = 0; i < n; i++) {
     const ai = cols ? 1 / a[i] : a[i], h = hsBuf[row];
     const area = ai * h * h * fy * s * s;
     sum += area; sumSq += area * area;
     if (i === n - 1 || (mask & (1 << i))) row++;
   }
   const mean = sum / n;
   const cv = Math.sqrt(Math.max(0, sumSq / n - mean * mean)) / mean;
   const coverage = sum / (aw * ah);
   const crop = Math.max(fy, 1 / fy) - 1;
   const cropCost = crop * 2 + Math.max(0, crop - MAX_CROP) * 12;
   return (1 - coverage) * 4 + cv * 4 + cropCost;
 }

 // Bygger rutorna (mm) för en vald lösning.
 function buildBoxes(items, mask, fill, cols) {
   const G = PAGE.GAP, n = items.length, M = PAGE.MARGIN;
   const aw = cols ? AH : AW, ah = cols ? AW : AH;
   const rows = [[]];
   items.forEach((it, i) => { rows[rows.length - 1].push(it); if (i < n - 1 && (mask & (1 << i))) rows.push([]); });
   const A = it => cols ? 1 / it.a : it.a;
   const hs = rows.map(row => (aw - (row.length - 1) * G) / row.reduce((s, it) => s + A(it), 0));
   const sumH = hs.reduce((x, y) => x + y, 0), availH = ah - (rows.length - 1) * G;
   const fy = fill ? availH / sumH : 1, s = fill ? 1 : Math.min(1, availH / sumH);
   const totH = sumH * fy * s + (rows.length - 1) * G;
   let y = M + (ah - totH) / 2;
   const boxes = [];
   rows.forEach((row, ri) => {
     const h = hs[ri] * fy * s;
     const ws = row.map(it => A(it) * hs[ri] * s);
     const rowW = ws.reduce((x, z) => x + z, 0) + (row.length - 1) * G;
     let x = M + (aw - rowW) / 2;
     row.forEach((it, k) => {
       boxes.push(cols ? { im: it.im, rot: it.rot, x: y, y: x, w: h, h: ws[k] }
                       : { im: it.im, rot: it.rot, x, y, w: ws[k], h });
       x += ws[k] + G;
     });
     y += h + G;
   });
   return boxes;
 }

 function orderings(n) {
   const id = [...Array(n).keys()];
   if (n <= 6) {
     const out = [];
     const perm = (a, k) => { if (k === n) { out.push(a.slice()); return; }
       for (let i = k; i < n; i++) { [a[k], a[i]] = [a[i], a[k]]; perm(a, k + 1); [a[k], a[i]] = [a[i], a[k]]; } };
     perm(id, 0);
     return out;
   }
   let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
   const out = [id];
   for (let t = 0; t < 250; t++) {
     const a = id.slice();
     for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
     out.push(a);
   }
   return out;
 }

 // Returnerar de bästa lösningarna för en sida, en per "typ" av uppdelning,
 // så att förslagen verkligen ser olika ut.
 function pageCandidates(imgs, fill) {
   if (!imgs.length) return [];
   const base = imgs.map(im => {
     const a = im.w / im.h, rot = imgs.length === 1 && fill && a > 1.05; // ensam liggande bild vrids
     return { im, a: rot ? 1 / a : a, rot };
   });
   const n = base.length, best = new Map();
   const totalMasks = 1 << (n - 1);
   // Vid många bilder provas ett representativt urval av radbrytningar så att verktyget förblir snabbt.
   const masks = totalMasks <= 4096
     ? Array.from({ length: totalMasks }, (_, i) => i)
     : Array.from({ length: 512 }, (_, i) => Math.floor(i * (totalMasks - 1) / 511));
   for (const ord of orderings(n)) {
     const a = ord.map(i => base[i].a);
     for (const mask of masks) {
       for (const cols of [false, true]) {
         if (n === 1 && cols) continue;
         const c = score(a, mask, fill, cols);
         let sig = cols ? 'K' : 'R', cnt = 0;
         for (let i = 0; i < n; i++) { cnt++; if (i === n - 1 || (mask & (1 << i))) { sig += cnt; cnt = 0; } }
         const prev = best.get(sig);
         if (!prev || c < prev.cost - 0.005) best.set(sig, { cost: c, ord, mask, cols });
       }
     }
   }
   return [...best.values()].sort((x, y) => x.cost - y.cost)
     .map(b => ({ cost: b.cost, boxes: buildBoxes(b.ord.map(i => base[i]), b.mask, fill, b.cols) }));
 }

 function splitSides() {
   const n = images.length;
   if (n === 1) return [images];
   const f = Math.ceil(n / 2);
   return [images.slice(0, f), images.slice(f)];
 }

 // EN bild = affisch: papperet vänds efter bilden (liggande bild → liggande A4)
 // och bilden fyller hela sidan, rättvänd.
 function posterProposals() {
   const im = images[0], land = im.w > im.h;
   const W = land ? PAGE.H : PAGE.W, H = land ? PAGE.W : PAGE.H, M = PAGE.MARGIN;
   const aw = W - 2 * M, ah = H - 2 * M, a = im.w / im.h;
   const fw = a > aw / ah ? aw : ah * a, fh = a > aw / ah ? aw / a : ah;
   return [
     { name: 'Affisch – fyller hela sidan', note: 'Bilden fyller hela papperet. Kanterna beskärs lite.',
       pages: [{ W, H, boxes: [{ im, x: M, y: M, w: aw, h: ah }] }] },
     { name: 'Hela bilden syns', note: 'Inget beskärs. Lite vit kant kan bli kvar.',
       pages: [{ W, H, boxes: [{ im, x: (W - fw) / 2, y: (H - fh) / 2, w: fw, h: fh }] }] }
   ];
 }

 function buildProposals() {
   if (posterBackId !== null) {
     const backImage = images.find(im => im.id === posterBackId);
     const frontImages = images.filter(im => im.id !== posterBackId);
     const backPage = { W: PAGE.W, H: PAGE.H, boxes: [{ im: backImage, x: 0, y: 0, w: PAGE.W, h: PAGE.H, fit: 'contain' }] };
     if (!frontImages.length) {
       proposals = [{ name: 'Hela bilden på baksidan', note: 'Hela bilden visas på ett eget A4-ark.', pages: [backPage] }];
       selected = 0; return;
     }
     const fill = pageCandidates(frontImages, true);
     const whole = pageCandidates(frontImages, false);
     const frontPage = list => ({ W: PAGE.W, H: PAGE.H, boxes: (list[0] || { boxes: [] }).boxes });
     const altPage = list => ({ W: PAGE.W, H: PAGE.H, boxes: (list[Math.min(1, list.length - 1)] || { boxes: [] }).boxes });
     proposals = [
       { name: 'Yta och balans', note: 'Kollage på framsidan. Den valda bilden får ett eget A4-ark.', pages: [frontPage(fill), backPage] },
       { name: 'Alternativ placering', note: 'Samma bilder, annan fördelning på framsidan.', pages: [altPage(fill), backPage] },
       { name: 'Hela bilderna syns', note: 'Kollage utan beskärning på framsidan. Egen A4-baksida.', pages: [frontPage(whole), backPage] }
     ];
     selected = 0; return;
   }
   if (images.length === 1) { proposals = posterProposals(); selected = 0; return; }
   const sides = splitSides();
   const fill = sides.map(s => pageCandidates(s, true));
   const whole = sides.map(s => pageCandidates(s, false));
   const pick = (lists, k) => lists.map(l => ({ W: PAGE.W, H: PAGE.H, boxes: (l[Math.min(k, l.length - 1)] || { boxes: [] }).boxes }));
   proposals = [
     { name: 'Fyll hela sidan', note: 'Inga vita ytor. Kanterna beskärs lite.', pages: pick(fill, 0) },
     { name: 'Fyll sidan – annan placering', note: 'Samma bilder, annan uppdelning.', pages: pick(fill, 1) },
     { name: 'Hela bilderna syns', note: 'Inget beskärs. Lite vit yta kan bli kvar.', pages: pick(whole, 0) }
   ];
   const key = p => JSON.stringify(p.pages.map(pg => pg.boxes.map(b => [b.x, b.y, b.w, b.h].map(v => v.toFixed(1)))));
   const seen = new Set();
   proposals = proposals.filter(p => { const k = key(p); if (seen.has(k)) return false; seen.add(k); return true; });
   selected = 0;
 }

 // ================= Visning =================
 function placeBox(b, unit, small, pg) {
   const cell = document.createElement('div'); cell.className = 'cell';
   const pos = unit === '%'
     ? [b.x / pg.W * 100, b.y / pg.H * 100, b.w / pg.W * 100, b.h / pg.H * 100].map(v => v + '%')
     : [b.x, b.y, b.w, b.h].map(v => v + 'mm');
   [cell.style.left, cell.style.top, cell.style.width, cell.style.height] = pos;
   const img = document.createElement('img'); img.src = small ? b.im.thumb : b.im.url; img.alt = '';
   if (b.fit === 'contain') img.classList.add('fit-contain');
   if (b.rot) {
     img.className = 'rot';
     img.style.width = (b.h / b.w * 100) + '%';
     img.style.height = (b.w / b.h * 100) + '%';
   }
   cell.append(img);
   return cell;
 }
 function pageEl(pg, small) {
   const page = document.createElement('div'); page.className = 'page';
   page.style.aspectRatio = `${pg.W} / ${pg.H}`;
   pg.boxes.forEach(b => page.append(placeBox(b, '%', small, pg)));
   return page;
 }

 function renderProposals() {
   const wrap = $('proposals'); wrap.innerHTML = '';
   proposals.forEach((p, i) => {
     const card = document.createElement('button'); card.type = 'button'; card.className = 'proposal';
     card.setAttribute('aria-pressed', String(i === selected));
     const t = document.createElement('div'); t.className = 'proposal-title'; t.textContent = `Förslag ${i + 1}: ${p.name}`;
     const sub = document.createElement('div'); sub.className = 'proposal-sub'; sub.textContent = p.note;
     const minis = document.createElement('div'); minis.className = 'mini-pages';
     if (p.pages.length === 1) minis.style.gridTemplateColumns = p.pages[0].W > p.pages[0].H ? '1fr' : '1fr 1fr';
     p.pages.forEach(pg => minis.append(pageEl(pg, true)));
     const chk = document.createElement('div'); chk.className = 'proposal-check';
     chk.textContent = i === selected ? '✓ Vald' : 'Tryck för att välja';
     card.append(t, sub, minis, chk);
     card.addEventListener('click', () => { selected = i; renderProposals(); });
     wrap.append(card);
   });
 }

 function renderPreview() {
   const pages = proposals[selected].pages;
   const preview = $('preview'), printRoot = $('printRoot');
   preview.innerHTML = ''; printRoot.innerHTML = '';
   const land = pages.length === 1 && pages[0].W > pages[0].H;
   preview.style.gridTemplateColumns = land ? 'minmax(0, 1fr)' : '';
   preview.style.maxWidth = land ? '760px' : ''; preview.style.marginInline = land ? 'auto' : '';
   // utskriftens pappersriktning följer sidan
   let ps = document.getElementById('pageStyle');
   if (!ps) { ps = document.createElement('style'); ps.id = 'pageStyle'; document.head.append(ps); }
   ps.textContent = `@media print{@page{size:A4 ${land ? 'landscape' : 'portrait'};margin:0}}`;
   pages.forEach((pg, i) => {
     const boxes = pg.boxes;
     const wrap = document.createElement('div'); wrap.className = 'page-wrap';
     const label = document.createElement('div'); label.className = 'page-label';
     label.innerHTML = `<span>${pages.length === 1 ? (land ? 'Affisch (liggande A4)' : 'Affisch (stående A4)') : i === 0 ? 'Framsida' : 'Baksida'}</span><span class="pill">${boxes.length} ${boxes.length === 1 ? 'bild' : 'bilder'}</span>`;
     wrap.append(label, pageEl(pg, false)); preview.append(wrap);
     const pp = document.createElement('div'); pp.className = 'print-page';
     pp.style.width = pg.W + 'mm'; pp.style.height = pg.H + 'mm';
     boxes.forEach(b => pp.append(placeBox(b, 'mm', false, pg)));
     printRoot.append(pp);
   });
   renderDownloadButtons();
 }

 // ================= Nedladdning =================
 document.querySelectorAll('.format').forEach(btn => btn.addEventListener('click', () => {
   format = btn.dataset.format;
   document.querySelectorAll('.format').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
   renderDownloadButtons();
 }));

 function renderDownloadButtons() {
   const pages = proposals[selected].pages, box = $('dlButtons');
   box.innerHTML = ''; $('msg').textContent = '';
   const mk = (txt, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'primary big'; b.textContent = txt; b.addEventListener('click', () => run(b, fn)); box.append(b); };
   if (format === 'pdf') {
     $('formatHelp').textContent = pages.length > 1 ? 'En fil med båda sidorna – bäst för utskrift.' : 'En fil – bäst för utskrift.';
     mk('↓ Ladda ner PDF', downloadPdf);
   } else {
     $('formatHelp').textContent = pages.length > 1 ? 'En bildfil per sida.' : 'En bildfil.';
     pages.forEach((pg, i) => mk(pages.length > 1 ? `↓ ${i === 0 ? 'Framsida' : 'Baksida'} (${format.toUpperCase()})` : `↓ Ladda ner ${format.toUpperCase()}`, () => downloadImage(i)));
   }
 }

 async function run(btn, fn) {
   const old = btn.textContent;
   btn.disabled = true; btn.textContent = 'Skapar fil …'; $('msg').textContent = '';
   await new Promise(r => setTimeout(r, 30));
   try { await fn(); $('msg').textContent = '✓ Filen är nedladdad.'; }
   catch (err) { console.error(err); $('msg').textContent = err.message || 'Något gick fel. Prova "Skriv ut direkt" istället.'; }
   btn.disabled = false; btn.textContent = old;
 }

 // Ritar en ruta (med samma beskärning/vridning som förhandsvisningen) på en canvas.
 function drawBox(ctx, b, X, Y, W, H) {
   const src = b.im.src, iw = src.width, ih = src.height;
   if (b.fit === 'contain') {
     const scale = Math.min(W / iw, H / ih), dw = iw * scale, dh = ih * scale;
     ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(X, Y, W, H);
     ctx.drawImage(src, X + (W - dw) / 2, Y + (H - dh) / 2, dw, dh); ctx.restore(); return;
   }
   const tAR = b.rot ? H / W : W / H;
   let sw = iw, sh = ih;
   if (iw / ih > tAR) sw = ih * tAR; else sh = iw / tAR;
   const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
   ctx.save();
   if (b.rot) {
     ctx.translate(X + W / 2, Y + H / 2); ctx.rotate(Math.PI / 2);
     ctx.drawImage(src, sx, sy, sw, sh, -H / 2, -W / 2, H, W);
   } else {
     ctx.drawImage(src, sx, sy, sw, sh, X, Y, W, H);
   }
   ctx.restore();
 }

 function stamp() {
   const d = new Date(), p = n => String(n).padStart(2, '0');
   return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
 }

 async function pdfCanvasBlob(canvas, type, quality) {
   return new Promise((resolve, reject) => {
     canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Kunde inte skapa bildsidan.')), type, quality);
   });
 }

 function asciiBytes(text) {
   const out = new Uint8Array(text.length);
   for (let i = 0; i < text.length; i++) out[i] = text.charCodeAt(i) & 255;
   return out;
 }

 function joinBytes(parts) {
   const length = parts.reduce((sum, part) => sum + part.length, 0);
   const out = new Uint8Array(length);
   let offset = 0;
   for (const part of parts) { out.set(part, offset); offset += part.length; }
   return out;
 }

 async function makeRasterPage(pg) {
   const k = EXPORT_DPI / 25.4;
   const canvas = document.createElement('canvas');
   canvas.width = Math.max(1, Math.round(pg.W * k));
   canvas.height = Math.max(1, Math.round(pg.H * k));
   const ctx = canvas.getContext('2d', { alpha: false });
   if (!ctx) throw new Error('Kunde inte skapa utskriftsbilden.');
   ctx.fillStyle = '#fff';
   ctx.fillRect(0, 0, canvas.width, canvas.height);
   ctx.imageSmoothingEnabled = true;
   ctx.imageSmoothingQuality = 'high';
   // Uses the same box geometry and image treatment as Claude's existing preview/export.
   pg.boxes.forEach(b => drawBox(ctx, b, b.x * k, b.y * k, b.w * k, b.h * k));
   const blob = await pdfCanvasBlob(canvas, 'image/jpeg', 0.94);
   const bytes = new Uint8Array(await blob.arrayBuffer());
   return { bytes, width: canvas.width, height: canvas.height, pageW: pg.W * 72 / 25.4, pageH: pg.H * 72 / 25.4 };
 }

 async function downloadPdf() {
   const pages = proposals[selected].pages;
   if (!pages.length) throw new Error('Det finns inga sidor att spara.');
   const rasterPages = [];
   for (const pg of pages) rasterPages.push(await makeRasterPage(pg));

   // Minimal PDF 1.4 writer: each A4 side is a JPEG image. No CDN or internet required.
   const objectCount = 2 + rasterPages.length * 3;
   const objects = new Array(objectCount + 1);
   objects[1] = asciiBytes('<< /Type /Catalog /Pages 2 0 R >>');
   const pageRefs = rasterPages.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
   objects[2] = asciiBytes(`<< /Type /Pages /Kids [${pageRefs}] /Count ${rasterPages.length} >>`);

   rasterPages.forEach((rp, i) => {
     const pageObj = 3 + i * 3;
     const imageObj = pageObj + 1;
     const contentObj = pageObj + 2;
     const content = `q\n${rp.pageW.toFixed(3)} 0 0 ${rp.pageH.toFixed(3)} 0 0 cm\n/Im0 Do\nQ`;
     const contentBytes = asciiBytes(content);
     objects[pageObj] = asciiBytes(
       `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${rp.pageW.toFixed(3)} ${rp.pageH.toFixed(3)}] ` +
       `/Resources << /XObject << /Im0 ${imageObj} 0 R >> >> /Contents ${contentObj} 0 R >>`
     );
     objects[imageObj] = joinBytes([
       asciiBytes(`<< /Type /XObject /Subtype /Image /Width ${rp.width} /Height ${rp.height} ` +
         `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${rp.bytes.length} >>\nstream\n`),
       rp.bytes,
       asciiBytes('\nendstream')
     ]);
     objects[contentObj] = joinBytes([
       asciiBytes(`<< /Length ${contentBytes.length} >>\nstream\n`),
       contentBytes,
       asciiBytes('\nendstream')
     ]);
   });

   const chunks = [asciiBytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
   const offsets = new Array(objectCount + 1).fill(0);
   let byteOffset = chunks[0].length;
   for (let id = 1; id <= objectCount; id++) {
     offsets[id] = byteOffset;
     const chunk = joinBytes([
       asciiBytes(`${id} 0 obj\n`),
       objects[id],
       asciiBytes('\nendobj\n')
     ]);
     chunks.push(chunk);
     byteOffset += chunk.length;
   }
   const xrefOffset = byteOffset;
   let xref = `xref\n0 ${objectCount + 1}\n0000000000 65535 f \n`;
   for (let id = 1; id <= objectCount; id++) xref += `${String(offsets[id]).padStart(10, '0')} 00000 n \n`;
   xref += `trailer\n<< /Size ${objectCount + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
   chunks.push(asciiBytes(xref));

   const pdf = new Blob([joinBytes(chunks)], { type: 'application/pdf' });
   const url = URL.createObjectURL(pdf);
   const a = document.createElement('a');
   a.href = url;
   a.download = `bildark-${stamp()}.pdf`;
   document.body.append(a);
   a.click();
   a.remove();
   setTimeout(() => URL.revokeObjectURL(url), 10000);
 }
 async function downloadImage(i) {
   const k = EXPORT_DPI / 25.4;
   const cv = document.createElement('canvas');
   const pg = proposals[selected].pages[i];
   cv.width = Math.round(pg.W * k); cv.height = Math.round(pg.H * k);
   const ctx = cv.getContext('2d');
   ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
   ctx.imageSmoothingQuality = 'high';
   pg.boxes.forEach(b => drawBox(ctx, b, b.x * k, b.y * k, b.w * k, b.h * k));
   const type = format === 'png' ? 'image/png' : 'image/jpeg';
   const blob = await new Promise(r => cv.toBlob(r, type, 0.92));
   const a = document.createElement('a');
   a.href = URL.createObjectURL(blob);
   a.download = `bildark-${stamp()}-${i === 0 ? 'framsida' : 'baksida'}.${format}`;
   document.body.append(a); a.click(); a.remove();
   setTimeout(() => URL.revokeObjectURL(a.href), 5000);
 }

 $('printBtn').addEventListener('click', () => window.print());

 renderList();
 showStep(0);
})();
</script>
